name: Create MyCalendar Signing Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing
          PASSWORD="$(openssl rand -hex 32)"
          keytool -genkeypair -v \
            -keystore signing/mycalendar-release.jks \
            -storetype JKS \
            -alias mycalendar \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=MyCalendar, OU=Android, O=MyCalendar, C=BD"
          base64 -w 0 signing/mycalendar-release.jks > signing/keystore-base64.txt
          {
            echo "ANDROID_KEYSTORE_PASSWORD=$PASSWORD"
            echo "ANDROID_KEY_ALIAS=mycalendar"
            echo "ANDROID_KEY_PASSWORD=$PASSWORD"
          } > signing/credentials.txt

      - name: Upload signing backup
        uses: actions/upload-artifact@v4
        with:
          name: MyCalendar-Signing-Setup
          path: signing/
          retention-days: 7

