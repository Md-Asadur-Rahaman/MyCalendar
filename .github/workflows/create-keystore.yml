
name: Create MyCalendar Signing Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate signing keystore
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          PASS="$(openssl rand -hex 32)"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/signing/mycalendar-release.jks" \
            -storetype JKS \
            -alias mycalendar \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=MyCalendar, OU=Android, O=MyCalendar, C=BD"
          base64 -w 0 "$RUNNER_TEMP/signing/mycalendar-release.jks" > "$RUNNER_TEMP/signing/keystore-base64.txt"
          {
            echo "ANDROID_KEYSTORE_PASSWORD=$PASS"
            echo "ANDROID_KEY_ALIAS=mycalendar"
            echo "ANDROID_KEY_PASSWORD=$PASS"
          } > "$RUNNER_TEMP/signing/credentials.txt"

      - name: Upload signing setup
        uses: actions/upload-artifact@v4
        with:
          name: MyCalendar-Signing-Setup
          path: |
            ${{ runner.temp }}/signing/mycalendar-release.jks
            ${{ runner.temp }}/signing/keystore-base64.txt
            ${{ runner.temp }}/signing/credentials.txt
          retention-days: 1
